name: Build Roblox Windows client (GitHub-hosted)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-client:
    # Standard GitHub-hosted runner; no VM or payment card is needed for this public fork.
    # The repo targets v140_xp, so the v143 override below is an experimental port attempt.
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore missing Boost.Thread Win32 sources
        shell: pwsh
        run: |
          $threadDir = Join-Path $env:GITHUB_WORKSPACE 'Library\boost\libs\thread\src\win32'
          New-Item -ItemType Directory -Path $threadDir -Force | Out-Null
          $baseUrl = 'https://raw.githubusercontent.com/boostorg/thread/boost-1.74.0/src/win32'
          foreach ($name in @('thread.cpp', 'tss_dll.cpp', 'tss_pe.cpp')) {
            Invoke-WebRequest -Uri "$baseUrl/$name" -OutFile (Join-Path $threadDir $name)
          }

      - name: Build repository's Boost static library (Release|Win32)
        shell: pwsh
        run: |
          $project = Join-Path $env:GITHUB_WORKSPACE 'boostlibs\boost.static.vcxproj'
          $msbuild = Get-Command msbuild.exe -ErrorAction Stop
          & $msbuild.Source $project /m /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /verbosity:minimal
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build WindowsClient (Release|Win32, v143 compatibility attempt)
        shell: pwsh
        run: |
          $solution = Join-Path $env:GITHUB_WORKSPACE 'Roblox.sln'
          $msbuild = Get-Command msbuild.exe -ErrorAction Stop
          & $msbuild.Source $solution /m /t:WindowsClient:Build /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /verbosity:minimal
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload client executable
        uses: actions/upload-artifact@v4
        with:
          name: WindowsClient-Release
          path: '**/RobloxPlayerBetaRaw.exe'
          if-no-files-found: error
