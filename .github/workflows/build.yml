name: Build Roblox 2016 Client

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      # 1. LAUNCH the v140 toolset install in the BACKGROUND - it overlaps
      #    with the clone/downloads below. Real wait happens in step 7.
      - name: Start v140 install in background
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $need = 'Microsoft.VisualStudio.Component.VC.14.00.x86.x64'
          $have = & $vswhere -latest -products * -requires $need -property installationPath
          if ($have) {
            Write-Host "v140 toolset already present - no install needed"
          } else {
            Set-Location "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\"
            $InstallPath = 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise'
            $componentsToAdd = @(
              'Microsoft.VisualStudio.Component.VC.14.00.x86.x64',
              'Microsoft.VisualStudio.Component.VC.14.00.ATL',
              'Microsoft.VisualStudio.Component.WinXP',
              'Microsoft.VisualStudio.Component.Windows81SDK'
            )
            $workloadArgs = ($componentsToAdd | ForEach-Object { " --add $_ " }) -join ''
            $Arguments = ('/c', 'vs_installer.exe', 'modify', '--installPath', "`"$InstallPath`"", $workloadArgs, '--quiet', '--norestart', '--nocache')
            Start-Process -FilePath cmd.exe -ArgumentList $Arguments -WindowStyle Hidden
            Write-Host "installer launched in background"
          }

      # 2. Restore the prepared source tree from a previous SUCCESSFUL run
      - name: Restore source cache
        id: srccache
        uses: actions/cache/restore@v4
        with:
          path: C:\Roblox\Source
          key: roblox-src-v1-${{ github.sha }}

      # 3. Clone (cache miss only)
      - name: Clone source to C:\Roblox\Source
        if: steps.srccache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          git config --global core.longpaths true
          git clone --depth 1 https://github.com/Artifaqt/ROBLOX2016.git C:\Roblox\Source

      # 4. Clean Boost 1.56.0 SOURCE only - no compiler build, boost.static
      #    handles that inside msbuild
      - name: Download clean Boost 1.56.0 source
        if: steps.srccache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          curl.exe -L -o "$env:TEMP\boost.zip" "https://archives.boost.io/release/1.56.0/source/boost_1_56_0.zip"
          Expand-Archive "$env:TEMP\boost.zip" "$env:TEMP\boost" -Force
          Copy-Item "$env:TEMP\boost\boost_1_56_0\*" "C:\Roblox\Source\Library\boost\" -Recurse -Force
          New-Item -ItemType Directory -Force -Path "C:\Roblox\Source\Library\boost\include" | Out-Null
          Copy-Item "C:\Roblox\Source\Library\boost\boost" "C:\Roblox\Source\Library\boost\include\boost" -Recurse -Force

      # 5. Restore the missing fmod folder via sparse clone (fast)
      - name: Restore missing fmod folder
        if: steps.srccache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config --global core.longpaths true
          git clone --depth 1 --filter=blob:none --sparse https://github.com/drippypop/rbx2016.git "$env:TEMP\fmodrepo"
          git -C "$env:TEMP\fmodrepo" sparse-checkout set fmod
          Copy-Item "$env:TEMP\fmodrepo\fmod" "C:\Roblox\Source\fmod" -Recurse -Force

      # 6. Junction insurance (leak scripts hardcode D:\Roblox\Source)
      - name: Map D:\Roblox\Source -> C:\Roblox\Source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "D:\Roblox" -Force | Out-Null
          New-Item -ItemType Junction -Path "D:\Roblox\Source" -Target "C:\Roblox\Source" | Out-Null

      # 7. Poll until v140 is REALLY registered (installer ran during steps 2-6)
      - name: Wait for v140 toolset
        shell: pwsh
        timeout-minutes: 25
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $need = 'Microsoft.VisualStudio.Component.VC.14.00.x86.x64'
          $deadline = (Get-Date).AddMinutes(20)
          Write-Host "Polling for v140 toolset registration..."
          do {
            $have = & $vswhere -latest -products * -requires $need -property installationPath
            if ($have) { break }
            Start-Sleep -Seconds 15
          } until ((Get-Date) -gt $deadline)
          if (-not $have) {
            Write-Host "ERROR: v140 toolset did not appear in time."
            exit 1
          }
          Write-Host "v140 toolset confirmed at: $have"

      # 8. Build ONLY the client (references pull in everything else)
      - name: Build WindowsClient
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x86 -vcvars_ver=14.0
          cd /d C:\Roblox\Source
          msbuild Roblox.sln /t:WindowsClient /p:Configuration=Release /p:Platform=Win32 /p:MultiProcessorCompilation=true /m /v:m /nologo

      # 9. Get the exe from the run's "Artifacts" section
      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: roblox-2016-client
          path: C:\Roblox\Source\WindowsClient\Win32\Release\*.exe
          if-no-files-found: error

      # 10. Cache the tree - ONLY on success, failures can't poison it
      - name: Save source cache
        if: success() && steps.srccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\Roblox\Source
          key: roblox-src-v1-${{ github.sha }}
