name: Build Roblox 2016 Client

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      # 1. Clone straight to C:\Roblox\Source (big repo + deep paths)
      - name: Clone source to C:\Roblox\Source
        shell: cmd
        run: |
          git config --global core.longpaths true
          git clone --depth 1 https://github.com/Artifaqt/ROBLOX2016.git C:\Roblox\Source

      # 2. build_boost.bat hardcodes D:\Roblox\Source\... — junction fixes it
      - name: Map D:\Roblox\Source -> C:\Roblox\Source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "D:\Roblox" -Force | Out-Null
          New-Item -ItemType Junction -Path "D:\Roblox\Source" -Target "C:\Roblox\Source" | Out-Null

      # 3. The leak is MISSING the "fmod" folder the vcxproj needs.
      #    Exact version used: FMOD Studio low-level API 1.07.02 (32-bit).
      - name: Restore missing fmod folder
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $base = "https://raw.githubusercontent.com/drippypop/rbx2016/main/fmod"
          $out  = "C:\Roblox\Source\fmod"
          New-Item -ItemType Directory -Force -Path "$out\include", "$out\win32\lib" | Out-Null
          $files = @(
            "include\fmod.h", "include\fmod.hpp", "include\fmod_common.h",
            "include\fmod_dsp.h", "include\fmod_errors.h",
            "win32\lib\fmod_vc.lib"
          )
          foreach ($f in $files) {
            Invoke-WebRequest -Uri "$base/$($f -replace '\\','/')" -OutFile "$out\$f"
          }
          Get-ChildItem $out -Recurse -File | Select-Object Name, Length

      # 4. Boost 1.56.0 — repo copy is broken (see Library/README.md)
      - name: Download clean Boost 1.56.0
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          curl.exe -L -o "$env:TEMP\boost.zip" "https://archives.boost.io/release/1.56.0/source/boost_1_56_0.zip"
          Expand-Archive "$env:TEMP\boost.zip" "$env:TEMP\boost" -Force
          Copy-Item "$env:TEMP\boost\boost_1_56_0\*" "C:\Roblox\Source\Library\boost\" -Recurse -Force

      # 5. Qt 4.8.5 — same deal
      - name: Download clean Qt 4.8.5
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          curl.exe -L -o "$env:TEMP\qt.zip" "https://download.qt.io/archive/qt/4.8/4.8.5/qt-everywhere-opensource-src-4.8.5.zip"
          Expand-Archive "$env:TEMP\qt.zip" "$env:TEMP\qt" -Force
          Copy-Item "$env:TEMP\qt\qt-everywhere-opensource-src-4.8.5\*" "C:\Roblox\Source\Library\Qt\" -Recurse -Force

      # 6. Build Boost. <nul matters: the bat ends with PAUSE and would hang the runner.
      - name: Build Boost
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x86 -vcvars_ver=14.0
          cd /d C:\Roblox\Source\Library\boost
          call bootstrap.bat
          cmd /c "build_boost.bat <nul"

      # 7. Build Qt (the long one, ~1-2.5 h). Errors at the very END are normal
      #    as long as the .lib files appear in Library\Qt\lib.
      - name: Build Qt 4.8.5
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x86 -vcvars_ver=14.0
          cd /d C:\Roblox\Source\Library\Qt
          configure -release -opensource -confirm-license -fast -no-webkit -nomake demos -nomake examples -nomake tools
          nmake sub-src

      # 8. Build ONLY the client (Xbox/Mac/Android/iOS projects are broken — never "Rebuild Solution")
      - name: Build WindowsClient
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x86 -vcvars_ver=14.0
          cd /d C:\Roblox\Source
          msbuild Roblox.sln /t:WindowsClient /p:Configuration=Release /p:Platform=Win32 /m /v:m /nologo

      # 9. Get the exe from the run's "Artifacts" section
      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: roblox-2016-client
          path: C:\Roblox\Source\WindowsClient\Win32\Release\*.exe
          if-no-files-found: error
